[package]
name = "learn_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "learn_rust"
path = "src/lib.rs"

[[bin]]
name = "learn_rust"
path = "src/main.rs"

[dependencies]
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
rand = "0.8"
rayon = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "multiply"
harness = false

[profile.release]
debug = true
opt-level = 3
